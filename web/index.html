<!DOCTYPE html>

<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Algorithm Visualizer</title>
		<script src="wasm/engine.js"></script>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<div id="container">
			<div id="left">
				<label>Algorithm Visualizer</label><br>
				<label for="algo">Sorting Algorithm:</label><br>
				<div class="select-box">
					<select id="algo" name="algo">
						<option value="bubbleSort">Bubble Sort</option>
						<option value="selectionSort">Selection Sort</option>
					</select>
				</div>
				
				<label for="size">Array Size: <span id="sizeText">10</span></label><br>
				<input type="range" id="size" min="5" max="100" step="1" value="10">
				
				<label for="speed">Animation Speed: <span id="speedText">50</span></label><br>
				<input type="range" id="speed" min="5" max="100" step="5" value="50">

				<button id="new" onclick="generateRandomArray()">New Array</button>
				<button id="reset" onclick="renderBars()">Reset</button>
				<button id="stop" onclick="stopSorting()" disabled>Stop</button>
				<button id="sort" onclick="startSorting()">Sort</button>
			</div>
			<div id="right">
				<div id="bar-container"></div>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
