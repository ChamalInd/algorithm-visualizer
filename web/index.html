<!DOCTYPE html>

<html>
	<head>
		<title>Algorithm Visualizer</title>
		<script src="wasm/engine.js"></script>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<div id="container">
			<div id="left">
				<label>Algorithm Visualizer</label><br>
				<label for="algo">Select the sorting algorithm:</label><br>
				<div class="select-box">
					<select id="algo" name="algo">
						<option value="bubbleSort">Bubble Sort</option>
					</select>
				</div>
				<label for="speed">Animation Speed: <span id="speedText">50</span></label><br>
				<input type="range" id="speed" min="5" max="100" step="5" value="50">
				
				<label for="size">Array Size: <span id="sizeText">10</span></label><br>
				<input type="range" id="size" min="5" max="100" step="1" value="10">

				<button onclick="generateRandomArray()">New Array</button>
				<button onclick="startSorting()">Sort</button>

				<div id="output">
					<p id="stepCount"></p>
					<p id="step"></p>
				</div>
			</div>
			<div id="right">
				<div id="bar-container"></div>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
